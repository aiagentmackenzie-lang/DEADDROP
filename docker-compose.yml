services:
  deaddrop:
    build:
      context: .
      dockerfile: Dockerfile
    image: deaddrop:latest
    container_name: deaddrop
    ports:
      - "8080:8080"
    volumes:
      - deaddrop-data:/root/.deaddrop
      - ./rules:/app/rules:ro
    environment:
      # ALWAYS set a token before exposing port 8080 beyond localhost.
      # The API authenticates Bearer tokens against this value.
      DEADDROP_API_TOKEN: ${DEADDROP_API_TOKEN:-}
      DEADDROP_HOST: 0.0.0.0
      DEADDROP_PORT: 8080
      # Optional: restrict CORS to specific origins (comma-separated)
      DEADDROP_CORS_ORIGINS: ${DEADDROP_CORS_ORIGINS:-}
      # Ollama endpoint for AI triage summaries (optional)
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    restart: unless-stopped

volumes:
  deaddrop-data: